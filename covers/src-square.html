<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#05060b;}
  #stage{width:800px;height:800px;position:relative;overflow:hidden;
    background: radial-gradient(ellipse at 50% 28%, #0d1424 0%, #05060b 60%);
    font-family: Arial, Helvetica, sans-serif;
  }
  svg{display:block;}
  .scrim{
    position:absolute; left:0; bottom:0; width:100%; height:340px;
    background: linear-gradient(to bottom, rgba(5,6,11,0) 0%, rgba(5,6,11,0.75) 45%, rgba(5,6,11,0.96) 100%);
  }
  .title{
    position:absolute; bottom:130px; left:0; width:100%; text-align:center;
    font-size:88px; font-weight:900; letter-spacing:4px; color:#bff3ff;
    text-shadow: 0 0 18px rgba(56,189,248,0.9), 0 0 46px rgba(56,189,248,0.55), 0 4px 10px rgba(0,0,0,0.8);
    margin:0;
  }
  .tagline{
    position:absolute; bottom:76px; left:0; width:100%; text-align:center;
    font-size:24px; font-weight:600; letter-spacing:2px; color:#cbd5e1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="stage">
<svg width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a5f3fc"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="rgba(129,140,248,0)"/>
    </radialGradient>
    <radialGradient id="bossCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="rgba(244,63,94,0)"/>
    </radialGradient>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- grid floor -->
  <g stroke="rgba(56,189,248,0.08)" stroke-width="1" id="gridlines"></g>

  <!-- stars -->
  <g fill="#cbe8ff">
    <circle cx="62" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="140" cy="380" r="1.2" opacity="0.6"/>
    <circle cx="88" cy="480" r="1.8" opacity="0.7"/>
    <circle cx="720" cy="50" r="1.4" opacity="0.6"/>
    <circle cx="740" cy="260" r="1.6" opacity="0.8"/>
    <circle cx="690" cy="440" r="1.3" opacity="0.5"/>
    <circle cx="40" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="600" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="420" cy="470" r="1.5" opacity="0.6"/>
    <circle cx="760" cy="380" r="1.3" opacity="0.5"/>
    <circle cx="20" cy="440" r="1.2" opacity="0.5"/>
  </g>

  <!-- boss, big and dim in the background -->
  <g transform="translate(560,240)" opacity="0.55">
    <g filter="url(#glowBig)" opacity="0.5">
      <circle r="140" fill="#f43f5e" opacity="0.35"/>
    </g>
    <circle r="156" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="18 14" opacity="0.55"/>
    <polygon points="140,0 99,-99 0,-125 -86,-89 -125,0 -86,89 0,125 99,99"
      fill="#450a0a" stroke="#fb7185" stroke-width="4"/>
    <circle r="42" fill="url(#bossCore)" filter="url(#glowSoft)"/>
  </g>

  <!-- battle bots converging -->
  <g transform="translate(150,150) rotate(140)">
    <polygon points="80,0 24,-52 -46,-66 -24,-17 -24,17 -46,66 24,52"
      fill="#3f1220" stroke="#f43f5e" stroke-width="5"/>
    <circle cx="36" cy="0" r="17" fill="#fecdd3" filter="url(#glowSoft)"/>
  </g>
  <g transform="translate(110,350) rotate(70) scale(1.15)">
    <polygon points="80,0 24,-52 -46,-66 -24,-17 -24,17 -46,66 24,52"
      fill="#7f1d1d" stroke="#fb7185" stroke-width="6"/>
    <circle r="60" fill="none" stroke="rgba(251,113,133,0.5)" stroke-width="3"/>
    <circle cx="36" cy="0" r="19" fill="#fecdd3" filter="url(#glowSoft)"/>
  </g>
  <g transform="translate(300,420) rotate(-120) scale(0.9)">
    <polygon points="80,0 24,-52 -46,-66 -24,-17 -24,17 -46,66 24,52"
      fill="#3f1220" stroke="#f43f5e" stroke-width="5"/>
    <circle cx="36" cy="0" r="17" fill="#fecdd3" filter="url(#glowSoft)"/>
  </g>

  <!-- player ship, hero position, facing up-right into the fight -->
  <g transform="translate(430,470) rotate(-55)">
    <polygon points="-32,-24 -110,0 -32,24" fill="#93c5fd" opacity="0.85" filter="url(#glowSoft)"/>
    <polygon points="88,0 -56,52 -32,0 -56,-52" fill="#e2e8f0" stroke="#38bdf8" stroke-width="7"/>
    <circle cx="24" cy="0" r="15" fill="#38bdf8"/>
  </g>
  <g transform="translate(478,426)">
    <circle r="30" fill="url(#orbGrad)" filter="url(#glowSoft)"/>
  </g>

  <g stroke="#e0f2fe" stroke-width="4" fill="none" opacity="0.9" filter="url(#glowSoft)">
    <polyline points="478,426 510,390 496,380 530,340"/>
    <polyline points="150,150 180,190 164,198 190,240"/>
  </g>
</svg>
<div class="scrim"></div>
<div class="title">BLADESTORM</div>
<div class="tagline">HORDE-MODE SURVIVAL &middot; NEWTONIAN DOGFIGHTING</div>
</div>
<script>
  const gl = document.getElementById('gridlines');
  let s = '';
  for (let x = 0; x <= 800; x += 90) s += `<line x1="${x}" y1="0" x2="${x}" y2="800"/>`;
  for (let y = 0; y <= 800; y += 90) s += `<line x1="0" y1="${y}" x2="800" y2="${y}"/>`;
  gl.innerHTML = s;
</script>
</body>
</html>
